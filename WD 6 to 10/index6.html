<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Experiment 6 - Name and Password Validation</title>

        <script>

            function validateForm() {

                const name = document.getElementById("name").value.trim();

                const password = document.getElementById("password").value;



                // Name must contain only letters and be at least 6 characters long.

                const namePattern = /^[A-Za-z]{6,}$/;



                if (!namePattern.test(name)) {

                    alert("Name must contain only alphabets and be at least 6 characters long.");

                    return false;

                }



                if (password.length < 6) {

                    alert("Password must be at least 6 characters long.");

                    return false;

                }



                alert("Name and password are valid!");

                return true;

            }

        </script>

    </head>

    <body>

        <h2>Registration Form - Experiment 6</h2>

        <form onsubmit="return validateForm()">

            <label for="name">Name:</label>

            <input type="text" id="name" name="name" required>

            <br><br>



            <label for="password">Password:</label>

            <input type="password" id="password" name="password" required>

            <br><br>



            <button type="submit">Register</button>

            <button type="reset">Reset</button>

        </form>

    </body>

</html>
