<!DOCTYPE html>

<html lang="en">

    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Experiment 9 - Background Repeat and Links</title>

        <style>
            body {

                font-family: Arial, sans-serif;

                margin: 30px;

                background-image: url("pattern.png");

                background-repeat: repeat;

                background-color: #f4f7fb;

            }



            .content {

                background-color: rgba(255, 255, 255, 0.92);

                padding: 20px;

                border: 1px solid #999;

                max-width: 700px;

            }



            /* Link states */

            a:link {

                color: blue;

                text-decoration: none;

            }



            a:visited {

                color: purple;

            }



            a:hover {

                color: red;

                text-decoration: underline;

            }



            a:active {

                color: green;

            }
        </style>

    </head>

    <body>

        <div class="content">

            <h2>CSS Background Repeat and Link States</h2>

            <p>The background image repeats across the page because

                background-repeat is set to repeat.</p>



            <p>Try the following links:</p>

            <a href="https://aktu.ac.in/">AKTU Website</a>

            <br><br>

            <a href="https://developer.mozilla.org/">MDN Web Docs</a>

        </div>

    </body>

</html>
